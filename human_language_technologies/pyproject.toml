[project]
name = "hlt"
version = "0.1.0"
description = "Human Language Technologies"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipywidgets>=8.1.9",
    "matplotlib>=3.10.9",
    "nltk>=3.10.3",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "pyqt6>=6.11.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "spacy>=3.8.16",
    "tiktokenizer>=0.1.1",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "tqdm>=4.67.3",
    "transformers>=5.18.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]
torchvision = [
    { index = "pytorch-cpu" },
]

hlt = { workspace = true, editable = true }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "jupyterlab>=4.5.7",
    "notebook>=7.5.5",
    "pyqt6>=6.11.0",
]
